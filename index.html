<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой сайт</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <!-- .page — это "холст" с картинкой дизайна, всё остальное лежит поверх него -->
  <div class="page">

    <!-- Видео-фон, задаёт высоту всей страницы -->
    <video class="design" autoplay loop muted playsinline>
      <source src="background.mp4" type="video/mp4">
    </video>

    <!-- Кнопка 1 -->
    <button class="btn btn-1" onclick="window.location.href='https://example.com'">Кнопка 1</button>

    <!-- Кнопка 2 -->
    <button class="btn btn-2" onclick="alert('Привет!')">Кнопка 2</button>

  </div>

</body>
</html>
