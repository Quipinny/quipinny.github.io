<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой сайт</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <!-- .page — это "холст" с картинкой дизайна, всё остальное лежит поверх него -->
  <div class="page">

    <!-- Видео-фон, задаёт высоту всей страницы -->
    <video class="design" autoplay loop muted playsinline>
      <source src="background.mp4" type="video/mp4">
    </video>

    <!-- Кнопка HIRE — открывает почту -->
    <a href="mailto:quipinny@gmail.com" class="btn-video btn-hire" aria-label="Написать на почту" onclick="playBtn(this)">
      <img class="btn-static" src="button1_static.png" alt="">
      <img class="btn-gif" src="button1.gif" alt="">
    </a>

    <!-- Кнопка feedback — открывает PDF с отзывами -->
    <a href="feedback.pdf" target="_blank" class="btn-video btn-feedback" aria-label="Отзывы" onclick="playBtn(this)">
      <img class="btn-static" src="button3_static.png" alt="">
      <img class="btn-gif" src="button3.gif" alt="">
    </a>

    <!-- Кнопка portfolio — ведёт на отдельную страницу портфолио -->
    <a href="https://quipinny.com/portfolio" class="btn-video btn-portfolio" aria-label="Портфолио" onclick="playBtn(this)">
      <img class="btn-static" src="button2_static.png" alt="">
      <img class="btn-gif" src="button2.gif" alt="">
    </a>

  </div>

  <script>
    // По клику показываем GIF вместо статичной картинки,
    // а через время (чуть больше длительности анимации) прячем GIF обратно.
    function playBtn(link) {
      const gif = link.querySelector('.btn-gif');
      const stat = link.querySelector('.btn-static');

      // Перезапускаем gif с начала (иначе если кликнуть повторно во время анимации, она не перезапустится)
      const src = gif.getAttribute('src');
      gif.setAttribute('src', '');
      gif.setAttribute('src', src);

      stat.style.display = 'none';
      gif.style.display = 'block';

      clearTimeout(link._btnTimer);
      link._btnTimer = setTimeout(() => {
        gif.style.display = 'none';
        stat.style.display = 'block';
      }, 400); // если анимация длиннее ~0.4 сек — увеличь это число
    }
  </script>

</body>
</html>
