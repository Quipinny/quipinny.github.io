<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой сайт</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <!-- .page — это "холст" с картинкой дизайна, всё остальное лежит поверх него -->
  <div class="page">

    <!-- Сама картинка дизайна, задаёт высоту всей страницы -->
    <img src="background.png" class="design" alt="дизайн сайта">

    <!-- Кнопка 1: подвинь top/left в style.css под своё место на картинке -->
    <button class="btn btn-1" onclick="window.location.href='https://example.com'">Кнопка 1</button>

    <!-- Кнопка 2 -->
    <button class="btn btn-2" onclick="alert('Привет!')">Кнопка 2</button>

    <!-- Видео/анимация (mp4) -->
    <video class="animation" autoplay loop muted playsinline>
      <source src="animation.mp4" type="video/mp4">
    </video>

    <!-- Если вместо видео у тебя GIF — используй так вместо <video> выше:
    <img class="animation" src="animation.gif" alt="анимация"> -->

  </div>

</body>
</html>
