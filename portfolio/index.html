<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio | Quipinny — Pixel Artist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body oncontextmenu="return false;">

  <!-- Верхняя навигация — липкая (всегда видна сверху), ссылки на категории -->
  <nav class="topnav" id="topnav">
    <a href="../" class="topnav-logo"><img src="Logo.png" alt="Quipinny"></a>
    <div class="topnav-links" id="topnav-links">
      <a href="#featured">Featured</a>
      <!-- Остальное заполняется автоматически из категорий в works.js -->
    </div>
  </nav>

  <!-- ===== Шапка ===== -->
  <header class="hero">
    <p class="hero-eyebrow">Pixel Artist · Indie Games</p>
    <h1 class="hero-title">QUIPINNY</h1>
    <p class="hero-tagline"> Characters, environments, UI and animation — crafted pixel by pixel for game worlds that need to feel alive.</p>
    <div class="hero-stats">
      <div class="stat"><span class="stat-num">6+</span><span class="stat-label">years</span></div>
      <div class="stat"><span class="stat-num">300+</span><span class="stat-label">projects</span></div>
      <div class="stat"><span class="stat-num">8</span><span class="stat-label">categories</span></div>
    </div>
  </header>

  <!-- ===== Избранные проекты — крупные карточки-"билеты" ===== -->
  <section class="featured" id="featured">
    <h2 class="section-title-main">Featured Projects</h2>
    <div class="featured-grid" id="featuredGrid"></div>
  </section>

  <!-- ===== Полная галерея по категориям ===== -->
  <main id="gallery"></main>

  <!-- Лайтбокс — увеличенный просмотр отдельной работы по клику -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div class="lightbox-content" id="lightboxContent"></div>
  </div>

  <!-- Модалка проекта — полная информация по клику на карточку-билет -->
  <div class="project-modal" id="projectModal" onclick="closeProject()">
    <div class="project-modal-content" id="projectModalContent" onclick="event.stopPropagation()"></div>
  </div>

  <script src="works.js?v=2"></script>
  <script src="projects.js?v=1"></script>
  <script src="script.js?v=6"></script>
</body>
</html>
